# MoiréGuard 默认配置

inference:
  tile_size: 512
  stride: 256
  threshold: 0.5
  coverage_threshold: 0.01
  device: "auto"
  precision: "fp32"
  fusion: "cosine"
  apply_morphology: false

model:
  active: "sfrnet_uhd"
  weights_path: "assets/weights/SFR_best.pth"
  tile_size: 512
  stride: 256
  device: "auto"
  precision: "fp32"

# 最大像素数限制 (1.5亿)
max_pixels: 150000000

relay:
  enabled: false        # 画面回传默认关闭（SDD 4.5.2 R7）
  host: "192.168.1.100"
  port: 9000
  interval_frames: 6
  jpeg_quality: 75
  downscale: 1080
  overlay_result: true
