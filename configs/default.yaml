# MoiréGuard 默认配置

inference:
  tile_size: 512
  stride: 256
  threshold: 0.5
  coverage_threshold: 0.01
  device: "auto"
  precision: "fp32"
  fusion: "cosine"
  apply_morphology: false

model:
  active: "sfrnet_uhd"
  weights_path: "assets/weights/SFR_best.pth"
  tile_size: 512
  stride: 256
  device: "auto"
  precision: "fp32"

# 最大像素数限制 (1.5亿)
max_pixels: 150000000

# 推理后端与模型文件（SDD §4.1）
# 镜像内置值为板端 RKNN；开发机由 HostDeviceIO 自动将 host 子节提升到 runtime 顶层
runtime:
  backend: "rknn"
  model_path: "/usr/share/moireguard/models/model.rknn"
  host:
    backend: "torch"
    model_path: "assets/weights/SFR_best.pth"

# 网络出口（app/adaptation/network 读取；逻辑层仅透传不解释）
# 默认关闭：镜像里不开口，现场写进 /var/lib/moireguard/override.yaml 才启用
network:
  enabled: false
  host: "127.0.0.1"      # 产线内网段或 0.0.0.0 才需配 token
  port: 8340
  token: ""              # 非空则要求 Authorization: Bearer <token>
  allow_paths: false     # 允许 JSON 请求用本机文件路径引用图像
  max_upload_mb: 64
  sse_heartbeat_s: 15.0

# WiFi 画面回传（app/adaptation/relay，旁路诊断面，见 SDD §4.5.2）
relay:
  enabled: false        # 画面回传默认关闭（SDD 4.5.2 R7）
  host: "192.168.1.100"
  port: 9000
  interval_frames: 6
  jpeg_quality: 75
  downscale: 1080
  overlay_result: true

# 两级级联门控（SDD v2.4.1 §3.3/§4.2）：有屏短路 screen_detected，无屏跑 SFRNet
# 开发机覆盖示例：backend: "onnx"，model_path: "build/models/yolo_screen.onnx"，
#               normalized_input: true（ONNX 路径除 255 在 gate 内做）
cascade:
  enabled: true
  backend: "rknnlite"
  model_path: "/usr/share/moireguard/models/yolo_screen.rknn"
  normalized_input: false
  screen_conf: 0.5        # 待实拍标定（Q13）
  gray_zone: 0.1
  gray_policy: "prefer_screen"   # 宁报不漏（v2.4.1 决议）
