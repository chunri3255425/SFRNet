[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "moireguard"
version = "1.0.0"
description = "摩尔纹视觉识别软件"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "MoireGuard Team"}
]
dependencies = [
    "torch>=2.2,<3.0",
    "torchvision>=0.17",
    "numpy>=1.24",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["moireguard*", "upstream*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
